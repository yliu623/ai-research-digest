<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Research Digest</title>
<meta name="description" content="Daily digest of new papers and news on AI in economics, finance, and operations/supply chain.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗞️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>AI Research Digest</h1>
      <p class="sub">New papers &amp; news on AI in economics, finance, and operations — one entry per run.</p>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="Search all digests (title, summary, source)…" aria-label="Search">
      <div class="chips" id="chips" role="group" aria-label="Filter by section"></div>
      <select id="jump" aria-label="Jump to date"></select>
    </div>
  </div>
</header>
<main class="wrap">
  <p id="status" class="status">Loading…</p>
  <div id="days"></div>
  <button id="more" class="more" hidden>Show older days</button>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
